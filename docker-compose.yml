# Local Nakama + CockroachDB for testing nakama-mcp.
# Usage:
#   docker compose up -d            # start (waits for healthchecks)
#   docker compose logs -f nakama   # watch logs
#   docker compose down -v          # stop and wipe data
#
# Once healthy:
#   - Client API   : http://127.0.0.1:7350  (server key: defaultkey)
#   - Console API  : http://127.0.0.1:7351  (admin / password)
#   - Console UI   : http://127.0.0.1:7351
services:
  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.1
    command: start-single-node --insecure --store=attrs=ssd,path=/var/lib/cockroach/
    restart: "no"
    volumes:
      - data:/var/lib/cockroach
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 3s
      timeout: 3s
      retries: 5

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address root@cockroachdb:26257 &&
          exec /nakama/nakama
          --name nakama1
          --database.address root@cockroachdb:26257
          --logger.level DEBUG
          --session.token_expiry_sec 7200
          --console.username admin
          --console.password password
          --socket.server_key defaultkey
    restart: "no"
    depends_on:
      cockroachdb:
        condition: service_healthy
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
