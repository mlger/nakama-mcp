name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build + smoke (no Nakama)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:resolve
      - run: npm run test:redact
      - run: npm run test:smoke
      - run: npm run test:http
      - run: npm run test:http-reaper
      - run: npm run test:version

  integration:
    name: Integration (live Nakama via Compose)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Start Nakama + CockroachDB
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run integration tests
        run: npm run test:integration
        env:
          NAKAMA_HOST: 127.0.0.1
          NAKAMA_PORT: "7350"
          NAKAMA_CONSOLE_PORT: "7351"
          NAKAMA_SERVER_KEY: defaultkey
          NAKAMA_CONSOLE_USERNAME: admin
          NAKAMA_CONSOLE_PASSWORD: password

      - name: Run HTTP integration tests
        run: npm run test:http-integration
        env:
          NAKAMA_HOST: 127.0.0.1
          NAKAMA_PORT: "7350"
          NAKAMA_CONSOLE_PORT: "7351"
          NAKAMA_SERVER_KEY: defaultkey
          NAKAMA_CONSOLE_USERNAME: admin
          NAKAMA_CONSOLE_PASSWORD: password

      - name: Dump Nakama logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
